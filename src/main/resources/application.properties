spring.application.name=hero-api

server.port=${PORT:8082}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.open-in-view=false

# Mail (com variáveis de ambiente)
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Liga as Virtual Threads para o Tomcat e para o Spring
spring.threads.virtual.enabled=true

# Flag para Cookies HttpOnly (false em desenvolvimento, true quando subir em produção com HTTPS)
application.security.jwt.cookie-secure=false